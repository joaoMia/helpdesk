name: helpdesk

services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: helpdesk-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB no .env}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:?Configure POSTGRES_TEST_DB no .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init/01-test-database.sh:/docker-entrypoint-initdb.d/01-test-database.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0
    networks:
      - database

volumes:
  postgres-data:

networks:
  database:
    driver: bridge
